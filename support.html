<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InsightDock | Support</title>
  <meta
    name="description"
    content="Official support page for InsightDock. Includes contact details, support scope, and FAQ."
  />
  <link rel="stylesheet" href="./assets/site.css" />
</head>
<body data-page="support">
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html">
        <span class="brand-mark">ID</span>
        <span data-i18n="brandName">InsightDock</span>
      </a>
      <nav class="nav-cluster" aria-label="Primary">
        <a class="pill" href="./index.html" data-i18n="navHome"></a>
        <a class="pill active" href="./support.html" data-i18n="navSupport"></a>
        <a class="pill" data-lang-aware-href="./privacy.html" data-i18n="navPrivacy"></a>
      </nav>
      <div class="nav-cluster" aria-label="Language">
        <a class="pill" data-lang-link="ja" data-base-href="./support.html" data-i18n="langJa"></a>
        <a class="pill" data-lang-link="en" data-base-href="./support.html" data-i18n="langEn"></a>
      </div>
    </header>

    <section class="page-hero">
      <div class="eyebrow" data-i18n="pageEyebrow"></div>
      <h1 data-i18n="heading"></h1>
      <p class="lead small-lead" data-i18n="intro"></p>
      <div class="meta-list">
        <div class="meta-item">
          <strong data-i18n="contactLabel"></strong>
          <a data-support-email></a>
        </div>
      </div>
    </section>

    <section class="content-grid">
      <article class="card content">
        <h2 data-i18n="section1"></h2>
        <ul>
          <li data-i18n="include1"></li>
          <li data-i18n="include2"></li>
          <li data-i18n="include3"></li>
          <li data-i18n="include4"></li>
          <li data-i18n="include5"></li>
        </ul>

        <h2 data-i18n="section2"></h2>
        <div class="faq-list">
          <div class="faq-item" data-i18n-html="faq1"></div>
          <div class="faq-item" data-i18n-html="faq2"></div>
          <div class="faq-item" data-i18n-html="faq3"></div>
        </div>

        <h2 data-i18n="section3"></h2>
        <p data-i18n="platform"></p>

        <h2 data-i18n="section4"></h2>
        <p data-i18n="scope"></p>

        <div class="callout" data-i18n="callout"></div>
      </article>

      <aside class="card aside-card">
        <div class="aside-section">
          <div class="feature-kicker" data-i18n="section5"></div>
          <ul class="link-list">
            <li><a data-lang-aware-href="./privacy.html" data-i18n="related1"></a></li>
            <li><a data-alt-lang-href="./support.html" data-i18n="related2"></a></li>
          </ul>
        </div>
        <p class="footer-note" data-i18n-html="footer"></p>
      </aside>
    </section>
  </main>
  <script src="./assets/site.js"></script>
</body>
</html>
